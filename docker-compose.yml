services:
  postgres:
    image: docker.io/library/postgres:18
    container_name: scrinium-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      # Named volume required on Windows/Podman: Postgres initdb cannot chmod NTFS bind mounts.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - scrinium
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: docker.io/dpage/pgadmin4:9
    container_name: scrinium-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-secret}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGPASSFILE: /pgadmin4/pgpass
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgadmin4/pgpass:ro
    ports:
      - "5050:80"
    networks:
      - scrinium
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: scrinium-keycloak
    command:
      - start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-appuser}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-secret}

      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"

      KC_HTTPS_ENABLED: "true"
      KC_HTTPS_KEY_STORE_FILE: /opt/keycloak/conf/keycloak.pfx
      KC_HTTPS_KEY_STORE_PASSWORD: ${KEYCLOAK_HTTPS_KEY_STORE_PASSWORD:-password}
      KC_HTTPS_KEY_STORE_TYPE: PKCS12

      KC_PROXY: edge
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./docker/certs/keycloak.pfx:/opt/keycloak/conf/keycloak.pfx:ro
    ports:
      - "8443:8443"
    networks:
      - scrinium
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  solr:
    image: docker.io/library/solr:10
    container_name: scrinium-solr
    environment:
      SOLR_SSL_ENABLED: "true"
      SOLR_SSL_KEY_STORE: /opt/solr/certs/solr.pfx
      SOLR_SSL_KEY_STORE_PASSWORD: ${SOLR_SSL_KEY_STORE_PASSWORD:-password}
      SOLR_SSL_KEY_STORE_TYPE: PKCS12
      SOLR_SSL_TRUST_STORE: /opt/solr/certs/solr.pfx
      SOLR_SSL_TRUST_STORE_PASSWORD: ${SOLR_SSL_KEY_STORE_PASSWORD:-password}
      SOLR_SSL_TRUST_STORE_TYPE: PKCS12
      SOLR_SSL_NEED_CLIENT_AUTH: "false"
      SOLR_SSL_WANT_CLIENT_AUTH: "false"
    ports:
      - "8983:8983"
    volumes:
      - ${SCRINIUM_DATA_DIR:-C:/ProgramData/Scrinium}/solr:/var/solr
      - ./docker/certs/solr.pfx:/opt/solr/certs/solr.pfx:ro
    command:
      - solr-precreate
      - documents
    networks:
      - scrinium
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sfk https://localhost:8983/solr/documents/admin/ping?wt=json | grep -q '\"status\":\"OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: scrinium-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - scrinium
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: docker.io/minio/minio:latest
    container_name: scrinium-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      # Host-visible blob store (override root via SCRINIUM_DATA_DIR in .env)
      - ${SCRINIUM_DATA_DIR:-C:/ProgramData/Scrinium}/minio:/data
    networks:
      - scrinium
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  tika:
    image: docker.io/apache/tika:latest
    container_name: scrinium-tika
    ports:
      - "9998:9998"
    networks:
      - scrinium
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9998/tika || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8
    container_name: scrinium-gotenberg
    environment:
      CHROMIUM_DISABLE_JAVASCRIPT: "true"
      LIBREOFFICE_AUTO_START: "true"
    ports:
      - "3000:3000"
    networks:
      - scrinium
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  scrinium:
    driver: bridge

volumes:
  postgres-data:
    name: scrinium-postgres-data
  pgadmin-data:
    name: scrinium-pgadmin-data
  redis-data:
    name: scrinium-redis-data
